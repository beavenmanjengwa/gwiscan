[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwiscan"
version = "1.0.1"
description = "Genome-wide identification and annotation pipeline for gene families or superfamilies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Beaven Manjengwa" }]
keywords = ["genome-wide identification", "genome-wide study", "genome-wide analysis", "annotation pipeline", "bioinformatics"]

dependencies = [
    "biopython>=1.80",
    "pandas>=1.5",
    "openpyxl>=3.1",
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gwiscan = "gwiscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gwiscan = ["scripts/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
